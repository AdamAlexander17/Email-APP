<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email - Email App</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="top-navbar">
        <div class="nav-left">
            <div class="nav-brand">
                <div class="brand-icon"><i class="fa-solid fa-envelope-open-text"></i></div>
                <div class="brand-text">
                    <span class="brand-name">Email App</span>
                </div>
            </div>
            <nav class="nav-tabs">
                <a href="home.html" class="nav-tab active" id="tab-email">
                    <i class="fa-regular fa-envelope"></i> Email
                </a>
                <a href="users.html" class="nav-tab" id="tab-users">
                    <i class="fa-solid fa-user"></i> Users
                </a>
                <a href="logs.html" class="nav-tab" id="tab-logs">
                    <i class="fa-solid fa-clock-rotate-left"></i> Logs
                </a>
            </nav>
        </div>
        <div class="nav-right">
            <div class="user-profile">
                <div class="user-avatar" id="user-avatar">M</div>
                <div class="user-info">
                    <span class="user-name" id="user-name">admin</span>
                </div>
            </div>
            <button class="btn-logout" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </header>

    <!-- Main Content - Email Module -->
    <div class="main-content">
        <div class="page-header">
            <div>
                <h2>Email</h2>
                <span class="page-subtitle" id="email-count">0 emails</span>
            </div>
        </div>

        <!-- Email Table Container -->
        <div class="table-container">
            <div class="table-toolbar">
                <div class="toolbar-left">
                    <div class="search-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" class="search-input" id="search-input" placeholder="Search emails...">
                    </div>
                </div>
                <div class="toolbar-right">
                    <span class="rows-label">Rows</span>
                    <select class="page-size-select" id="page-size-select">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    <div class="pagination-compact" id="pagination">
                    </div>
                </div>
            </div>

            <div id="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 16%; cursor:pointer;" data-sort="from_email" onclick="sortEmails('from_email')">FROM <i class="fa-solid fa-sort sort-icon"></i></th>
                            <th style="width: 11%; cursor:pointer;" data-sort="subject" onclick="sortEmails('subject')">SUBJECT <i class="fa-solid fa-sort sort-icon"></i></th>
                            <th style="width: 7%;">BRAND</th>
                            <th style="width: 12%;">MESSAGE</th>
                            <th style="width: 7%;">ATTACHMENT</th>
                            <th style="width: 9%;">COMMENT</th>
                            <th style="width: 6%; cursor:pointer;" data-sort="status" onclick="sortEmails('status')">STATUS <i class="fa-solid fa-sort sort-icon"></i></th>
                            <th style="width: 9%;">RESOLUTION TIME</th>
                            <th style="width: 11%; cursor:pointer;" data-sort="created_at" onclick="sortEmails('created_at')">DATE <i class="fa-solid fa-sort-down sort-icon active"></i></th>
                            <th style="width: 12%; text-align: right;">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="emails-tbody">
                    </tbody>
                </table>

                <div id="loading-overlay" class="loading-overlay" style="display: none;">
                    <div>
                        <div class="spinner"></div>
                        <div class="loading-text">Loading emails...</div>
                    </div>
                </div>

                <div id="empty-state" class="empty-state" style="display: none;">
                    <div class="empty-icon"><i class="fa-regular fa-envelope"></i></div>
                    <h3>No emails yet</h3>
                    <p>Emails received via webhook will appear here.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Comment Modal -->
    <div class="modal-overlay" id="comment-modal">
        <div class="modal" style="max-width: 500px;">
            <div class="modal-header">
                <h3><i class="fa-regular fa-comment"></i> Add Comment</h3>
                <button class="modal-close" data-close="comment-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="comment-form" novalidate>
                    <input type="hidden" id="comment-email-id">
                    <div class="form-group">
                        <label for="comment-text">Comment</label>
                        <textarea id="comment-text" rows="4" style="width:100%; padding:0.6rem 0.75rem; font-size:0.9rem; font-family:var(--font-family); border:1px solid var(--color-border); border-radius:var(--border-radius-sm); resize:vertical;" placeholder="Enter your comment..."></textarea>
                        <div class="form-error" id="comment-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="comment-status">Status</label>
                        <select id="comment-status" style="width:100%; padding:0.6rem 0.75rem; font-size:0.9rem; border:1px solid var(--color-border); border-radius:var(--border-radius-sm);">
                            <option value="Pending">Pending</option>
                            <option value="Resolved" selected>Resolved</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close="comment-modal">Cancel</button>
                <button class="btn btn-primary" id="comment-submit-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Attachment Viewer Modal -->
    <div class="modal-overlay" id="attachment-modal">
        <div class="modal" style="max-width: 800px;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-paperclip"></i> Attachment</h3>
                <button class="modal-close" data-close="attachment-modal">&times;</button>
            </div>
            <div class="modal-body" id="attachment-content" style="padding: 1rem; min-height: 200px;">
            </div>
        </div>
    </div>

    <!-- View Email Modal -->
    <div class="modal-overlay" id="view-email-modal">
        <div class="modal" style="max-width: 640px;">
            <div class="modal-header">
                <h3 id="view-email-subject">Email Subject</h3>
                <button class="modal-close" data-close="view-email-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="email-meta">
                    <div class="email-meta-row">
                        <span class="email-meta-label">From:</span>
                        <span id="view-email-from"></span>
                    </div>
                    <div class="email-meta-row">
                        <span class="email-meta-label">To:</span>
                        <span id="view-email-to"></span>
                    </div>
                    <div class="email-meta-row">
                        <span class="email-meta-label">Date:</span>
                        <span id="view-email-date"></span>
                    </div>
                </div>
                <div class="email-body" id="view-email-body"></div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/emails.js"></script>
</body>
</html>
