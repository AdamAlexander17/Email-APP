<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email App - Redirecting...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }
        .loading {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <p>Redirecting...</p>
    </div>

    <script>
        (function () {
            /**
             * Check authentication state and redirect accordingly.
             * - If a valid access token exists in localStorage, redirect to home.
             * - Otherwise, redirect to login.
             *
             * Validates: Requirement 3.5 - IF an unauthenticated user attempts to
             * access the Home_Page, THEN THE Frontend_Client SHALL redirect the
             * user to the Login_Page.
             */
            const accessToken = localStorage.getItem('access_token');

            if (accessToken) {
                // User has a stored access token — redirect to email page
                window.location.replace('home.html');
            } else {
                // No access token found — user is unauthenticated, redirect to login
                window.location.replace('login.html');
            }
        })();
    </script>
</body>
</html>
